<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg1:#FFF8EE;--bg2:#FFF3E0;--bg3:#FFFDF8;
            --red:#D4422A;--red2:#B8301C;--gold:#E8A317;
            --dark:#2C1810;--cream:#FFF5E6;
            --green:#3A7D44;--lgold:#F5C846;
            --text:#3B2312;--text2:#6B4C30;--text3:#9A7B5A;
        }
        html,body{width:100%;height:100%;overflow:hidden}
        body{font-family:'Nunito',sans-serif;color:var(--text);background:var(--bg1)}

        .tv{
            width:100vw;height:100vh;position:relative;overflow:hidden;
            display:grid;grid-template-rows:auto auto 1fr auto;
            gap:.35vh;padding:.5vh 1vw .4vh;
            background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
        }

        /* ═══ DECO ═══ */
        .deco{position:absolute;inset:0;pointer-events:none;z-index:0}
        .deco div{position:absolute;border-radius:50%;opacity:.07}
        .dc1{width:30vw;height:30vw;top:-12vw;right:-5vw;background:var(--red)}
        .dc2{width:25vw;height:25vw;bottom:-10vw;left:-5vw;background:var(--gold)}
        .dc3{width:15vw;height:15vw;top:40%;left:-3vw;background:var(--green)}
        .deco svg{position:absolute;opacity:.05}
        .df1{width:11vh;top:3%;right:1%;fill:var(--red);transform:rotate(15deg)}
        .df2{width:9vh;bottom:4%;left:1%;fill:var(--green);transform:rotate(-20deg)}
        .df3{width:10vh;top:50%;right:.5%;fill:var(--red);transform:rotate(-10deg)}
        .df4{width:8vh;top:4%;left:1%;fill:var(--green);transform:rotate(-12deg)}

        /* ═══ HEADER ═══ */
        .hdr{text-align:center;position:relative;z-index:2;padding:.2vh 0}
        .hdr h1{
            font-family:'Playfair Display',serif;
            font-size:4.5vh;font-weight:900;color:var(--dark);
            letter-spacing:1vw;text-transform:uppercase;
        }
        .hdr-sub{font-size:1.2vh;color:var(--text3);letter-spacing:.4vw;text-transform:uppercase;font-weight:700}
        .hdr-line{height:2px;margin-top:.2vh;background:linear-gradient(90deg,transparent 10%,var(--red) 35%,var(--gold) 50%,var(--red) 65%,transparent 90%)}

        /* ═══ KOMBO HERO ═══ */
        .hero{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:.8vw}
        .combo{
            display:flex;align-items:center;gap:.8vw;
            background:linear-gradient(135deg,rgba(212,66,42,.08),rgba(245,200,70,.1),rgba(255,255,255,.6));
            backdrop-filter:blur(12px);
            border:2px solid rgba(212,66,42,.2);
            border-radius:1.2vh;padding:.8vh .7vw;
            position:relative;overflow:hidden;
            box-shadow:0 4px 20px rgba(0,0,0,.06);
        }
        .combo::before{
            content:'';position:absolute;top:0;left:0;right:0;height:50%;
            background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);
            pointer-events:none;border-radius:1.2vh 1.2vh 0 0;
        }
        .combo-tag{
            position:absolute;top:.5vh;right:.5vw;
            font-size:1.2vh;font-weight:900;letter-spacing:.12vw;
            color:#fff;background:var(--red);
            padding:.2vh .5vw;border-radius:.35vh;
            box-shadow:0 2px 8px rgba(212,66,42,.3);
        }
        .combo img{
            width:11vh;height:11vh;border-radius:1vh;
            object-fit:cover;flex-shrink:0;
            border:2px solid rgba(255,255,255,.6);
            box-shadow:0 4px 16px rgba(0,0,0,.12);
        }
        .cc{flex:1}
        .cc-n{font-family:'Playfair Display',serif;font-size:2.8vh;font-weight:900;color:var(--dark);line-height:1.1;margin-bottom:.2vh}
        .cc-p{font-family:'Playfair Display',serif;font-size:3.5vh;font-weight:900;color:var(--red);line-height:1;margin-bottom:.15vh}
        .cc-p small{font-family:'Nunito',sans-serif;font-size:1.3vh;color:var(--text3);font-weight:700;margin-left:.2vw}
        .cc-d{font-size:1.5vh;color:var(--text2);font-weight:700;line-height:1.3}
        .cc-d b{color:var(--dark);font-weight:900}
        .cc-plus{color:var(--red);font-weight:900;margin:0 .12vw}

        /* ═══ MAIN — 3 COLUMNS ═══ */
        .grid{
            position:relative;z-index:1;
            display:grid;grid-template-columns:1fr 1fr 1fr;
            gap:.7vw;min-height:0;overflow:hidden;
        }
        .col{display:flex;flex-direction:column;gap:.4vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
        .col::-webkit-scrollbar{display:none}

        /* ═══ PANEL ═══ */
        .pnl{
            display:flex;flex-direction:column;
            background:rgba(255,255,255,.45);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.7);
            border-radius:.8vh;padding:.4vh .4vw;
            box-shadow:0 2px 12px rgba(0,0,0,.04);
        }

        /* brush header */
        .ph{
            display:flex;align-items:center;
            margin-bottom:.35vh;position:relative;
            padding:.25vh .4vw;
        }
        .ph::before{
            content:'';position:absolute;inset:0;
            background:var(--red);border-radius:.4vh;
            transform:skewX(-2deg);opacity:.9;
        }
        .ph h2{
            position:relative;z-index:1;
            font-family:'Playfair Display',serif;
            font-size:2.6vh;font-weight:900;color:#fff;
            text-transform:uppercase;letter-spacing:.1vw;
            text-shadow:0 1px 3px rgba(0,0,0,.15);
        }

        .pi{display:flex;flex-direction:column;gap:.35vh}

        /* ═══ FOOD ITEM ═══ */
        .fi{
            display:flex;gap:.4vw;align-items:center;
            background:rgba(255,255,255,.5);
            border:1px solid rgba(255,255,255,.8);
            border-radius:.5vh;padding:.35vh .3vw;
            backdrop-filter:blur(6px);
            box-shadow:0 1px 6px rgba(0,0,0,.03);
        }
        .fi img{
            width:6vh;height:6vh;border-radius:.4vh;
            object-fit:cover;flex-shrink:0;
            border:1px solid rgba(0,0,0,.06);
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }
        .fi-b{flex:1;min-width:0}
        .fi-r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.15vh}
        .fi-n{font-size:2.8vh;font-weight:900;color:var(--dark);line-height:1.15}
        .fi-p{
            font-family:'Playfair Display',serif;
            font-size:3.2vh;font-weight:900;color:var(--red);
            white-space:nowrap;flex-shrink:0;
        }

        /* ═══ VARIANTS ═══ */
        .vr{display:flex;flex-wrap:wrap;gap:.15vh .12vw}
        .vt{
            display:inline-flex;align-items:center;gap:.1vw;
            background:rgba(232,163,23,.08);
            border:1px solid rgba(232,163,23,.15);
            border-radius:.25vh;padding:.08vh .22vw;
        }
        .vn{font-size:1.8vh;color:var(--text2);font-weight:700}
        .vp{font-size:1.9vh;color:var(--red2);font-weight:900}

        /* ═══ DRINKS SECTION ═══ */
        .dk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3vh .2vw}

        /* oddiy ichimlik — rasmsiz, kompakt */
        .dk{
            display:flex;justify-content:space-between;align-items:center;
            padding:.3vh .3vw;
            background:rgba(255,255,255,.5);
            border:1px solid rgba(255,255,255,.8);
            border-radius:.4vh;backdrop-filter:blur(6px);
            box-shadow:0 1px 4px rgba(0,0,0,.03);
        }
        .dk-n{font-size:2.1vh;font-weight:800;color:var(--dark)}
        .dk-p-wrap{display:flex;flex-wrap:wrap;gap:.08vw;justify-content:flex-end}
        .dk-p-wrap .vt{border:none;background:rgba(232,163,23,.12)}
        .dk-pr{font-size:2.1vh;font-weight:900;color:var(--red)}

        /* maxito — rasmli, premium */
        .dk-mox{
            display:flex;align-items:center;gap:.3vw;
            padding:.35vh .3vw;
            background:linear-gradient(135deg,rgba(58,125,68,.08),rgba(255,255,255,.5));
            border:1.5px solid rgba(58,125,68,.2);
            border-radius:.5vh;backdrop-filter:blur(8px);
            box-shadow:0 2px 8px rgba(0,0,0,.05);
        }
        .dk-mox img{
            width:4.5vh;height:4.5vh;border-radius:.4vh;
            object-fit:cover;flex-shrink:0;
            border:1px solid rgba(58,125,68,.2);
            box-shadow:0 2px 6px rgba(0,0,0,.1);
        }
        .dk-mox .dk-n{font-size:2vh}
        .dk-mox .dk-pr{font-size:2.1vh}

        /* sub-label */
        .dk-label{
            grid-column:1/-1;
            font-size:1.3vh;font-weight:900;color:var(--red);
            text-transform:uppercase;letter-spacing:.08vw;
            padding:.15vh 0;
            border-top:1px dashed rgba(212,66,42,.2);
            margin-top:.1vh;
        }

        /* ═══ DESSERT ROW — pastda to'liq kenglik ═══ */
        .dessert-row{
            position:relative;z-index:1;
            background:rgba(255,255,255,.45);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.7);
            border-radius:.8vh;padding:.35vh .4vw;
            box-shadow:0 2px 12px rgba(0,0,0,.04);
        }
        .sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.2vh .1vw}
        .sw{
            display:flex;flex-direction:column;align-items:center;
            padding:.3vh .1vw;text-align:center;
            background:rgba(255,255,255,.5);
            border:1px solid rgba(255,255,255,.8);
            border-radius:.4vh;backdrop-filter:blur(6px);
        }
        .sw img{width:4.5vh;height:4.5vh;border-radius:.3vh;object-fit:cover;border:1px solid rgba(0,0,0,.05);margin-bottom:.15vh}
        .sw-n{font-size:1.7vh;font-weight:800;color:var(--dark);line-height:1.1}
        .sw-p{font-size:1.8vh;font-weight:900;color:var(--red)}

        /* ═══ BANNER ═══ */
        .banner{
            position:relative;z-index:2;
            background:linear-gradient(135deg,var(--red),#e8553a,var(--red2));
            border-radius:1vh;padding:.6vh 1.5vw;
            display:flex;align-items:center;justify-content:center;gap:1vw;
            box-shadow:0 4px 20px rgba(212,66,42,.25);
            overflow:hidden;
        }
        .banner::before{
            content:'';position:absolute;top:0;left:0;right:0;height:50%;
            background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);
            pointer-events:none;border-radius:1vh 1vh 0 0;
        }
        .banner-pct{
            font-family:'Playfair Display',serif;
            font-size:4vh;font-weight:900;color:var(--lgold);
            text-shadow:0 2px 8px rgba(0,0,0,.2);
            line-height:1;
        }
        .banner-txt{
            font-size:2.2vh;font-weight:900;color:#fff;
            text-transform:uppercase;letter-spacing:.15vw;
            text-shadow:0 1px 4px rgba(0,0,0,.15);
        }
        .banner-sub{
            font-size:1.4vh;font-weight:700;color:rgba(255,255,255,.85);
        }
        /* ═══ THANKS ═══ */
        .thanks{
            position:relative;z-index:2;
            text-align:center;
            font-family:'Playfair Display',serif;
            font-size:2vh;font-weight:900;font-style:italic;
            color:var(--red);
            letter-spacing:.1vw;
            padding:.2vh 0;
        }
        .delivery{
            font-family:'Nunito',sans-serif;
            font-size:1.5vh;font-weight:800;font-style:normal;
            color:var(--dark);
            letter-spacing:.05vw;
            margin-top:.1vh;
        }

        /* ═══ PRINT / SCREENSHOT BUTTON ═══ */
        .save-btn{
            position:fixed;top:1vh;right:1vw;z-index:999;
            background:var(--red);color:#fff;border:none;
            padding:.6vh 1vw;border-radius:.5vh;cursor:pointer;
            font-family:'Nunito',sans-serif;font-size:1.5vh;font-weight:800;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }
        .save-btn:hover{background:var(--red2)}
        @media print{.save-btn{display:none}}
    </style>
</head>
<body>

<button class="save-btn" onclick="saveAsImage()">Rasm saqlash</button>
<div class="tv" id="tvScreen">
    <div class="deco">
        <div class="dc1"></div><div class="dc2"></div><div class="dc3"></div>
        <svg class="df1" viewBox="0 0 100 100"><path d="M50 5c-5 0-10 8-10 20 0 20 5 55 10 70 5-15 10-50 10-70C60 13 55 5 50 5z"/><path d="M45 5c-3-4-8-5-10-2s0 7 3 9c2 1 5 0 7-2z"/></svg>
        <svg class="df2" viewBox="0 0 100 100"><path d="M10 90C10 90 15 20 80 10c0 0-10 30-25 45S10 90 10 90z"/></svg>
        <svg class="df3" viewBox="0 0 100 100"><circle cx="50" cy="55" r="35"/><path d="M35 25c5-8 15-12 15-12s10 4 15 12c-5-2-10-3-15-3s-10 1-15 3z" fill="currentColor" opacity=".6"/></svg>
        <svg class="df4" viewBox="0 0 100 100"><path d="M10 90C10 90 15 20 80 10c0 0-10 30-25 45S10 90 10 90z"/></svg>
    </div>

    <div class="hdr">
        <div class="hdr-sub">Burgerlar, Hot-doglar, Lavash, Pitsa va Boshqalar</div>
        <div class="hdr-line"></div>
    </div>

    <div class="hero" id="heroRow"></div>
    <div class="grid" id="foodGrid"></div>
    <div class="thanks">Tanlovingiz uchun rahmat!<div class="delivery">Yetkazib berish xizmati mavjud: @n1bito_bot</div></div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║  MENYU MA'LUMOTLARI — NARXLARNI SHU YERDAN O'ZGARTIRING!       ║
// ╚══════════════════════════════════════════════════════════════════╝

const MENU = {

  // ─── 1-USTUN: BURGERLAR + HOT-DOGLAR ───
  burgerlar: {
    col:1, cat:"Burgerlar", items:[
      { name:"Non Burger", price:"38,000", img:"images/non-burger.jpg",
        vars:[["Kotta","38,000"],["Kichik","33,000"]] },
      { name:"Tovuq Burger", price:"33,000", img:"images/tovuq-burger.jpg",
        vars:[["Kotta","33,000"],["Kichik","28,000"]] },
      { name:"Burger", price:"33,000", img:"images/burger.jpg",
        vars:[["Oddiy","33,000"],["Chizburger","36,000"],["Bigburger","40,000"],["ChikenBurger","30,000"],["MiksBurger","40,000"]] },
    ]
  },
  hotdoglar: {
    col:1, cat:"Hot-Doglar", items:[
      { name:"Hotdog", price:"13,000", img:"images/hotdog.webp",
        vars:[["Oddiy","13,000"],["Kanada","16,000"]] },
      { name:"Dvaynoy Hotdog", price:"16,000", img:"images/dvaynoy-hotdog.jpg",
        vars:[["Oddiy","16,000"],["Kanada","20,000"]] },
      { name:"BBQ Hotdog", price:"28,000", img:"images/bbq-hotdog.jpg",
        vars:[["Oddiy","28,000"],["Dvaynoy BBQ","38,000"]] },
      { name:"Haggi", price:"33,000", img:"images/haggi.jpg",
        vars:[["Kichik","33,000"],["Kotta","40,000"]] },
    ]
  },

  // ─── 2-USTUN: LAVASH + PITSA + GARNIRLAR ───
  lavash: {
    col:2, cat:"Lavash", items:[
      { name:"Lavash mol go'shti", price:"37,000", img:"images/lavash-goshti.jpg",
        vars:[["Oddiy","37,000"],["Oddiy tandir","39,000"],["Sirli","40,000"],["Sirli tandir","42,000"]] },
      { name:"Lavash tovuqli", price:"33,000", img:"images/lavash-tovuq.jpg",
        vars:[["Oddiy","33,000"],["Tandir","35,000"],["Sirli tovuq","37,000"],["Sirli tandir","40,000"]] },
    ]
  },
  pitsa: {
    col:2, cat:"Pitsa", items:[
      { name:"Peperoni", price:"60,000", img:"images/peperoni.jpg",
        vars:[["25 sm","60,000"],["35 sm","92,000"]] },
      { name:"Pizza Donar", price:"72,000", img:"images/pizza-donar.jpg",
        vars:[["25 sm","72,000"],["35 sm","110,000"]] },
      { name:"Pizza Assorti", price:"66,000", img:"images/pizza-assorti.jpg",
        vars:[["25 sm","66,000"],["35 sm","100,000"]] },
      { name:"Pizza Qazili", price:"90,000", img:"images/pizza-qazili.jpg",
        vars:[["25 sm","90,000"],["35 sm","120,000"]] },
    ]
  },
  garnirlar: {
    col:2, cat:"Garnirlar", items:[
      { name:"Fri", price:"15,000", img:"images/fri.jpg",
        vars:[["Oddiy","15,000"],["Po derevenski","20,000"]] },
    ]
  },

  // ─── 3-USTUN: ICHIMLIKLAR + SHIRINLIKLAR ───
  ichimliklar: {
    col:3, cat:"Ichimliklar", type:"drinks", items:[
      { name:"Fanta", img:"images/fanta.jpg",
        vars:[["0.5L","7,000"],["1L","12,000"],["1.5L","15,000"]] },
      { name:"Cola", img:"images/cola.jpg",
        vars:[["0.5L","7,000"],["1L","12,000"],["1.5L","15,000"]] },
      { name:"FuseTea Ko'k", img:"images/fusetea-kok.jpg",
        vars:[["0.5L","8,000"],["1L","13,000"]] },
      { name:"FuseTea Qora", img:"images/fusetea-qora.jpg",
        vars:[["0.5L","8,000"],["1L","13,000"]] },
      { name:"Bonaqua Gazli/Gazsiz", img:"images/bonaqua.jpg",
        vars:[["0.5L","4,000"],["1L","6,000"],["1.5L","8,000"]] },
    ]
  },
  maxito: {
    col:3, cat:"Maxito", type:"drinks", items:[
      { name:"Maxito Laim", img:"images/maxito-laim.jpg",
        vars:[["1 ta","20,000"]] },
      { name:"Maxito Ocean", img:"images/maxito-ocean.jpg",
        vars:[["1 ta","20,000"]] },
      { name:"Maxito Malina", img:"images/maxito-malina.jpg",
        vars:[["1 ta","20,000"]] },
      { name:"Maxito Ananasli", img:"images/maxito-ananas.jpg",
        vars:[["1 ta","20,000"]] },
    ]
  },
  balnishniy: {
    col:3, type:"baln", items:[
      { name:"Cola baln.", price:"10,000", img:"images/cola-baln.jpg" },
      { name:"Fanta baln.", price:"10,000", img:"images/fanta-baln.jpg" },
      { name:"Sprite baln.", price:"10,000", img:"images/sprite-baln.jpg" },
    ]
  },
  shirinliklar: {
    col:3, cat:"Desertlar", type:"sweets", items:[
      { name:"Chizkeyk Iriska", price:"32,000", img:"images/chizkeyk-iriska.jpg" },
      { name:"Chizkeyk Fistikli", price:"32,000", img:"images/chizkeyk-fistikli.jpg" },
      { name:"Chizkeyk New York", price:"32,000", img:"images/chizkeyk-newyork.jpg" },
      { name:"Chizkeyk Malinali", price:"32,000", img:"images/chizkeyk-malinali.jpg" },
      { name:"Maxroviy tort", price:"20,000", img:"images/maxroviy-tort.jpg" },
      { name:"Medovik", price:"20,000", img:"images/medovik.jpg" },
      { name:"Fistashkali lenta", price:"42,000", img:"images/fistashkali-lenta.jpg" },
      { name:"Rulet Snickers", price:"32,000", img:"images/rulet-snickers.jpg" },
      { name:"Pirojniy Malinali", price:"20,000", img:"images/pirojniy-malinali.jpg" },
      { name:"Spartak", price:"20,000", img:"images/spartak.jpg" },
      { name:"Trayfl", price:"25,000", img:"images/trayfl.jpg" },
      { name:"Trayfl Snickers", price:"50,000", img:"images/trayfl-snickers.jpg" },
    ]
  },

  // ═══ KOMBO ═══
  kombo: [
    { name:"Student Kombo", price:"33,000", img:"images/kombo1.jpg",
      items:["Hotdog","Fri","Cola balnishniy"] },
    { name:"Student Kombo 2", price:"50,000", img:"images/kombo2.jpg",
      items:["Lavash tovuqli","Fri","Fanta balnishniy","Sous ketchup"] },
  ]
};

// ═══ RENDER ═══
(function(){
  // COMBO
  document.getElementById('heroRow').innerHTML = MENU.kombo.map(k=>{
    const d = k.items.map(i=>`<b>${i}</b>`).join('<span class="cc-plus">+</span>');
    return `<div class="combo">
      <span class="combo-tag">KOMBO SET</span>
      <img src="${k.img}">
      <div class="cc">
        <div class="cc-n">${k.name}</div>
        <div class="cc-p">${k.price}<small>so'm</small></div>
        <div class="cc-d">${d}</div>
      </div>
    </div>`;
  }).join('');

  // GRID
  const grid = document.getElementById('foodGrid');
  const byCols = {1:[],2:[],3:[]};
  Object.entries(MENU).forEach(([k,s])=>{ if(k!=='kombo') byCols[s.col].push(s); });

  // helpers
  function renderDrink(d){
    const sv=(d.vars||[]).map(v=>`<div class="vt"><span class="vn">${v[0]}</span><span class="vp">${v[1]}</span></div>`).join('');
    return `<div class="dk"><img src="${d.img}"><div class="dk-i"><span class="dk-n">${d.name}</span><div class="dk-s">${sv}</div></div></div>`;
  }
  function renderBaln(items){
    return '<div class="b3">'+items.map(d=>
      `<div class="dk"><img src="${d.img}"><div class="dk-i"><span class="dk-n">${d.name}</span><span class="dk-pr">${d.price}</span></div></div>`
    ).join('')+'</div>';
  }
  function renderItem(it){
    const vs=(it.vars||[]).map(v=>`<div class="vt"><span class="vn">${v[0]}</span><span class="vp">${v[1]}</span></div>`).join('');
    return `<div class="fi"><img src="${it.img}"><div class="fi-b"><div class="fi-r"><span class="fi-n">${it.name}</span><span class="fi-p">${it.price}</span></div><div class="vr">${vs}</div></div></div>`;
  }
  function renderSweets(items){
    let h='<div class="sw-grid">';
    items.forEach(it=>{ h+=`<div class="sw"><img src="${it.img}"><span class="sw-n">${it.name}</span><span class="sw-p">${it.price}</span></div>`; });
    return h+'</div>';
  }

  grid.innerHTML = '';
  for(let c=1;c<=3;c++){
    const col = document.createElement('div');
    col.className='col';

    if(c===3){
      // 3-USTUN: Ichimliklar + Maxito + Baln bitta panelda, keyin Desertlar
      let dh='<div class="ph"><h2>Ichimliklar</h2></div><div class="dk-grid">';
      // Oddiy ichimliklar — rasmsiz, nom + hajmlar
      MENU.ichimliklar.items.forEach(d=>{
        const sv=(d.vars||[]).map(v=>`<div class="vt"><span class="vn">${v[0]}</span><span class="vp">${v[1]}</span></div>`).join('');
        dh+=`<div class="dk"><span class="dk-n">${d.name}</span><div class="dk-p-wrap">${sv}</div></div>`;
      });
      // Balnishniy — rasmsiz
      MENU.balnishniy.items.forEach(d=>{
        dh+=`<div class="dk"><span class="dk-n">${d.name}</span><span class="dk-pr">${d.price}</span></div>`;
      });
      // Maxito — rasmli, ajralib turadi
      
      MENU.maxito.items.forEach(d=>{
        const pr=(d.vars||[]).map(v=>v[1]).join('');
        dh+=`<div class="dk-mox"><img src="${d.img}"><span class="dk-n">${d.name}</span><span class="dk-pr">${pr}</span></div>`;
      });
      dh+='</div>';
      col.innerHTML+=`<div class="pnl">${dh}</div>`;

      // Desertlar
      let sh='<div class="ph"><h2>Desertlar</h2></div>';
      sh+=renderSweets(MENU.shirinliklar.items);
      col.innerHTML+=`<div class="pnl">${sh}</div>`;
    } else {
      byCols[c].forEach(sec=>{
        if(sec.type==='drinks'||sec.type==='baln'||sec.type==='sweets') return;
        let h='';
        if(sec.cat) h+=`<div class="ph"><h2>${sec.cat}</h2></div>`;
        h+='<div class="pi">';
        sec.items.forEach(it=>{ h+=renderItem(it); });
        h+='</div>';
        col.innerHTML+=`<div class="pnl">${h}</div>`;
      });
    }

    grid.appendChild(col);
  }

})();

// ═══ RASM SAQLASH ═══
function saveAsImage(){
  const btn = document.querySelector('.save-btn');
  btn.style.display='none';
  const el = document.getElementById('tvScreen');
  const s = window.devicePixelRatio || 2;
  html2canvas(el,{
    scale: s,
    useCORS: true,
    backgroundColor: null,
    width: el.offsetWidth,
    height: el.offsetHeight
  }).then(canvas=>{
    btn.style.display='';
    const link = document.createElement('a');
    link.download = 'menu.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err=>{
    btn.style.display='';
    alert('Xatolik: '+err.message);
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
